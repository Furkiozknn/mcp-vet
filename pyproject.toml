[project]
name = "mcp-vet"
version = "0.3.0"
description = "Standalone CLI + Claude Code skill for vetting MCP servers before install"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
