[project]
name = "mcp-vet"
version = "0.5.0"
description = "Trust and security auditing for MCP servers: capabilities, credentials, data flow, dependencies, provenance"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furki Ozkan" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "audit",
    "static-analysis",
    "supply-chain",
    "claude",
    "llm-tooling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
# Standard library only, deliberately. An auditing tool that pulls in a
# dependency tree to run is asking you to trust more code in order to check
# less of it.
dependencies = []

[project.optional-dependencies]
# pytest 9 dropped Python 3.9. Without the markers below, a resolver that
# must satisfy every interpreter this package claims (requires-python
# >=3.9) finds no solution and Dependabot's update job fails outright.
# The >=9.0.3 floor is GHSA-wjm7-fv2f-2xw3 (pytest tmpdir permissions);
# Python 3.9 cannot take that release, so that leg stays on pytest 8 until
# 3.9 is dropped from the CI matrix. Dev-only, never shipped to users.
dev = [
    "pytest>=7,<9; python_version < '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
]

[project.scripts]
mcp-vet = "mcp_vet.cli:main"

[project.urls]
Homepage = "https://github.com/Furkiozknn/mcp-vet"
Security = "https://github.com/Furkiozknn/mcp-vet/blob/master/SECURITY.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_vet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
