<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <radialGradient id="pbg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0e1a16"/>
      <stop offset="60%" stop-color="#0a120f"/>
      <stop offset="100%" stop-color="#060a08"/>
    </radialGradient>
    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gateglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8effc2" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8ec9ff"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffd76d"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8effc2"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#pbg)"/>
  <rect width="1200" height="640" fill="url(#pgrid)"/>

  <text x="600" y="42" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="26" fill="#e8f5ee" letter-spacing="1">The Vetting Pipeline</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#c9e8d8" opacity="0.7">six steps between "find me an MCP server" and anything touching your machine</text>

  <!-- ============ ROW 1 : discovery (blue) ============ -->
  <!-- Step 1: Clarify -->
  <g transform="translate(40,100)">
    <rect width="340" height="172" rx="14" fill="#101f19" stroke="#8ec9ff" stroke-opacity="0.65" stroke-width="1.6"/>
    <circle cx="30" cy="30" r="18" fill="#8ec9ff"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">1</text>
    <!-- icon: speech bubble -->
    <g transform="translate(272,14)" filter="url(#pglow)">
      <path d="M0,0 h40 a8,8 0 0 1 8,8 v20 a8,8 0 0 1 -8,8 h-22 l-10,10 v-10 h-8 a8,8 0 0 1 -8,-8 v-20 a8,8 0 0 1 8,-8 z" fill="none" stroke="#8ec9ff" stroke-width="2.4"/>
      <text x="24" y="24" text-anchor="middle" font-family="'Cascadia Code',monospace" font-size="16" fill="#8ec9ff">?</text>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#e8f5ee">Clarify the need</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Restate scope in one line — "an MCP</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">server that controls Discord", not just</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">"discord". Ask if the request is vague.</text>
  </g>

  <path d="M382,186 H422" stroke="#8ec9ff" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Search -->
  <g transform="translate(430,100)">
    <rect width="340" height="172" rx="14" fill="#101f19" stroke="#8ec9ff" stroke-opacity="0.65" stroke-width="1.6"/>
    <circle cx="30" cy="30" r="18" fill="#8ec9ff"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">2</text>
    <!-- icon: magnifying glass -->
    <g transform="translate(285,10)" filter="url(#pglow)">
      <circle cx="17" cy="17" r="13" fill="none" stroke="#8ec9ff" stroke-width="2.6"/>
      <line x1="26" y1="26" x2="38" y2="38" stroke="#8ec9ff" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#e8f5ee">Search GitHub</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85"><tspan font-family="Consolas,monospace" fill="#8ec9ff">gh search repos</tspan> two phrasings,</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">5-10 raw candidates. Thin results fall</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">back to curated awesome-mcp lists.</text>
  </g>

  <path d="M772,186 H812" stroke="#8ec9ff" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Vet heuristic -->
  <g transform="translate(820,100)">
    <rect width="340" height="172" rx="14" fill="#101f19" stroke="#ffd76d" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="30" cy="30" r="18" fill="#ffd76d"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">3</text>
    <!-- icon: flag -->
    <g transform="translate(292,10)" filter="url(#pglow)">
      <line x1="4" y1="0" x2="4" y2="40" stroke="#ffd76d" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M4,4 L30,10 L4,20 Z" fill="#ffd76d"/>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#e8f5ee">Vet the heuristic</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Pull stars / forks / age per candidate.</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Flag as suspicious when all three</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">inflation signals hold at once.</text>
  </g>

  <!-- connector curving from row1 end down to row2 start -->
  <path d="M990,272 C990,330 990,330 990,340 C990,352 980,362 968,362" fill="none" stroke="#ffd76d" stroke-width="2.2" marker-end="url(#arrowGold)"/>

  <!-- ============ ROW 2 : ranking + review + gate ============ -->
  <!-- Step 4: Rank (right side, mirrors under step3) -->
  <g transform="translate(820,362)">
    <rect width="340" height="172" rx="14" fill="#101f19" stroke="#ffd76d" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="30" cy="30" r="18" fill="#ffd76d"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">4</text>
    <!-- icon: podium bars -->
    <g transform="translate(280,12)" filter="url(#pglow)">
      <rect x="0" y="20" width="10" height="18" fill="#ffd76d" opacity="0.85"/>
      <rect x="14" y="8" width="10" height="30" fill="#ffd76d"/>
      <rect x="28" y="16" width="10" height="22" fill="#ffd76d" opacity="0.85"/>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#e8f5ee">Rank top 2–3</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Present stars, forks, age, the flag</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">(if any), and a one-line take on each</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">— never silently down to one option.</text>
  </g>

  <path d="M812,448 H772" stroke="#8effc2" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- Step 5: Source review (middle, mirrors step2) -->
  <g transform="translate(430,362)">
    <rect width="340" height="172" rx="14" fill="#101f19" stroke="#8effc2" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="30" cy="30" r="18" fill="#8effc2"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">5</text>
    <!-- icon: eye -->
    <g transform="translate(282,16)" filter="url(#pglow)">
      <path d="M0,10 C8,-4 32,-4 40,10 C32,24 8,24 0,10 Z" fill="none" stroke="#8effc2" stroke-width="2.4"/>
      <circle cx="20" cy="10" r="5.5" fill="#8effc2"/>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#e8f5ee">Review the source</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Clone to a scratch dir, read every</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">executable file — not just the README.</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#c9e8d8" opacity="0.85">Flag stray network calls, exfil, obfuscation.</text>
  </g>

  <path d="M422,448 H382" stroke="#8effc2" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- Step 6: Install gate (left, mirrors step1) -->
  <g transform="translate(40,362)" filter="url(#gateglow)">
    <rect width="340" height="172" rx="14" fill="#161206" stroke="#ffd76d" stroke-width="2.4"/>
    <circle cx="30" cy="30" r="18" fill="#ffd76d"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="16" fill="#0a120f">6</text>
    <!-- icon: padlock -->
    <g transform="translate(288,8)">
      <path d="M6,18 v-6 a12,12 0 0 1 24,0 v6" fill="none" stroke="#ffd76d" stroke-width="2.8"/>
      <rect x="0" y="18" width="36" height="24" rx="4" fill="#ffd76d"/>
      <rect x="15" y="27" width="6" height="10" rx="2" fill="#161206"/>
    </g>
    <text x="30" y="78" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="19" fill="#ffd76d">Install — with approval</text>
    <text x="30" y="106" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#f3e4c2" opacity="0.9">Nothing is added to .mcp.json or</text>
    <text x="30" y="126" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#f3e4c2" opacity="0.9">~/.claude/skills/ until you say go.</text>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#f3e4c2" opacity="0.9">Scratch clone is deleted either way.</text>
  </g>

  <text x="210" y="612" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffd76d" opacity="0.85" letter-spacing="0.5">🚦 human checkpoint — no silent auto-install, ever</text>
</svg>
