<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0e1a16"/>
      <stop offset="60%" stop-color="#0a120f"/>
      <stop offset="100%" stop-color="#060a08"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8effc2"/>
      <stop offset="55%" stop-color="#5fe0c0"/>
      <stop offset="100%" stop-color="#8ec9ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g fill="#8effc2" opacity="0.06">
    <circle cx="200" cy="260" r="140"/>
    <circle cx="1020" cy="60" r="120"/>
  </g>

  <!-- shield glyph -->
  <g transform="translate(130,90)" filter="url(#glow)">
    <path d="M60,0 L115,20 L115,65 C115,105 90,132 60,150 C30,132 5,105 5,65 L5,20 Z"
          fill="none" stroke="#8effc2" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M35,75 L52,94 L88,50" fill="none" stroke="#ffd76d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="660" y="140" text-anchor="middle" font-family="'Cascadia Code', 'Consolas', monospace" font-weight="700" font-size="66" fill="url(#title)" letter-spacing="2">mcp-vet</text>

  <text x="660" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" fill="#c9e8d8" opacity="0.85" letter-spacing="1">Discover an MCP server. Vet it. Read its source. Then install.</text>

  <text x="660" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" fill="#e8f5ee" opacity="0.95">🔍 Popularity Vetting &#160;&#160;&#160; 🕵️ Source Review &#160;&#160;&#160; 🚦 Explicit Approval &#160;&#160;&#160; 🧩 Claude Code Skill</text>
</svg>
