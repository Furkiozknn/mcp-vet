<g font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" xml:space="preserve"><text x="340.0" y="21.0" text-anchor="middle" fill="#6b6b77">mcp-vet — a real run against a real server</text></g>
<g font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" xml:space="preserve">
<text x="22.0" y="61.0" fill="#c9a961" font-weight="600">$ </text>
<text x="37.7" y="61.0" fill="#f2efe6">mcp-vet audit --offline --path ./nvidia-nim-mcp</text>
<text x="22.0" y="101.0" fill="#9a9aa6">  OVERALL RISK   </text>
<text x="155.1" y="101.0" fill="#d7d75f" font-weight="600">MEDIUM</text>
<text x="202.1" y="101.0" fill="#6b6b77">        source </text>
<text x="319.5" y="101.0" fill="#d7d75f">MEDIUM</text>
<text x="366.5" y="101.0" fill="#6b6b77">  ·  deps </text>
<text x="444.8" y="101.0" fill="#4ade9e">LOW</text>
<text x="22.0" y="141.0" fill="#9a9aa6">  Capabilities detected</text>
<text x="22.0" y="161.0" fill="#6cb6ff">    environment.read   </text>
<text x="202.1" y="161.0" fill="#6b6b77">nvidia_image.py:31</text>
<text x="22.0" y="181.0" fill="#6cb6ff">    filesystem.read    </text>
<text x="202.1" y="181.0" fill="#6b6b77">nvidia_image.py:80</text>
<text x="22.0" y="201.0" fill="#6cb6ff">    encoding.base64    </text>
<text x="202.1" y="201.0" fill="#6b6b77">nvidia_image.py:537</text>
<text x="22.0" y="221.0" fill="#6cb6ff">    package.install    </text>
<text x="202.1" y="221.0" fill="#6b6b77">tests/test_output_dir.py:5</text>
<text x="22.0" y="261.0" fill="#9a9aa6">  Network destinations</text>
<text x="22.0" y="281.0" fill="#d7d75f">    UNEXPLAINED     </text>
<text x="178.6" y="281.0" fill="#d8d3c6">integrate.api.nvidia.com   image.pollinations.ai</text>
<text x="22.0" y="301.0" fill="#4ade9e">    INFRASTRUCTURE  </text>
<text x="178.6" y="301.0" fill="#d8d3c6">pypi.org   github.com   modelcontextprotocol.io</text>
<text x="22.0" y="341.0" fill="#9a9aa6">  Findings</text>
<text x="22.0" y="361.0" fill="#d7d75f" font-weight="600">    MEDIUM  </text>
<text x="116.0" y="361.0" fill="#d8d3c6">Invokes a package manager at runtime</text>
<text x="22.0" y="381.0" fill="#d8d3c6">            </text>
<text x="116.0" y="381.0" fill="#6b6b77">tests/test_output_dir.py:5</text>
<text x="22.0" y="401.0" fill="#4ade9e" font-weight="600">    LOW     </text>
<text x="116.0" y="401.0" fill="#d8d3c6">3 of 3 dependencies use floating version ranges</text>
<text x="22.0" y="441.0" fill="#9a9aa6">  What this did not check</text>
<text x="22.0" y="461.0" fill="#6b6b77">    No static analyzer can prove an MCP server is safe.</text>
</g>
<rect x="0.5" y="0.5" width="679" height="485" rx="9" fill="none" stroke="#26252f"/>
</g></svg>