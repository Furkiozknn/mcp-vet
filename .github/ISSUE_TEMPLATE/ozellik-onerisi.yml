name: Ozellik onerisi
description: Yeni bir yetenek veya iyilestirme oner
title: "[oneri] "
labels: ["oneri"]
body:
  - type: textarea
    id: sorun
    attributes:
      label: Hangi sorunu cozuyor?
      description: Ozellikten once problemi anlat. "Su an X yapmak icin Y gerekiyor" gibi.
    validations:
      required: true
  - type: textarea
    id: cozum
    attributes:
      label: Onerdigin cozum
    validations:
      required: true
  - type: textarea
    id: alternatif
    attributes:
      label: Degerlendirdigin alternatifler
      description: Varsa. Yoksa bos birak.