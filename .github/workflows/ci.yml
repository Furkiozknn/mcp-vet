name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 21 sn
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest -v

  # The unit tests mock every request. This job proves the packaged CLI works
  # end to end on a real filesystem, and - more importantly - that the exit
  # codes a CI gate depends on are what the docs promise. A scanner whose exit
  # code silently drifts is a gate that silently stops gating.
  cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 13 sn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # Every step below captures the exit code before asserting on it.
      # mcp-vet exits non-zero by severity *on purpose*, and these steps run
      # under `bash -e`, so a bare invocation would abort the step before its
      # assertion ever ran - which is exactly how the `report` step failed.
      - name: Clean fixture must exit 0
        run: |
          set +e
          mcp-vet audit --offline --path tests/fixtures/clean_server >/dev/null
          code=$?
          set -e
          test "$code" -eq 0 || { echo "expected exit 0, got $code"; exit 1; }

      - name: Exfiltration fixture must exit 2 (HIGH)
        run: |
          set +e
          mcp-vet audit --offline --path tests/fixtures/exfil_server >/dev/null
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Poisoned fixture must exit 3 (CRITICAL)
        run: |
          set +e
          mcp-vet audit --offline --path tests/fixtures/poisoned_server >/dev/null
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; exit 1; }

      - name: Bad invocation must exit 4, not 0
        run: |
          set +e
          mcp-vet audit --offline >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; exit 1; }

      # argparse exits 2 on a usage error, and 2 is HIGH. A path that does
      # not exist used to audit as an empty tree and exit 0.
      - name: Unknown flag and missing path must exit 4, not 2 or 0
        run: |
          set +e
          mcp-vet audit --offline --path . --no-such-flag >/dev/null 2>&1
          flag=$?
          mcp-vet audit --offline --path ./does-not-exist >/dev/null 2>&1
          missing=$?
          set -e
          test "$flag" -eq 4 || { echo "unknown flag: expected 4, got $flag"; exit 1; }
          test "$missing" -eq 4 || { echo "missing path: expected 4, got $missing"; exit 1; }

      # `report` is `audit` with JSON output, so it carries the same
      # severity exit code - 2 here, because the fixture is a HIGH finding.
      # The JSON on stdout is still complete and must still parse.
      - name: JSON output must parse and carry a schema version
        run: |
          set +e
          mcp-vet report --offline --path tests/fixtures/exfil_server > report.json
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 from report, got $code"; exit 1; }
          python3 -c "import json; d=json.load(open('report.json')); assert d['schema_version']; assert d['findings']"

      # The hostile fixture carries injection text in its README, so this
      # audit legitimately exits 1. What is being asserted is the output, not
      # the code.
      - name: Report must contain no terminal escape sequences
        run: |
          set +e
          mcp-vet audit --offline --path tests/fixtures/hostile_text --verbose > out.txt
          code=$?
          set -e
          test "$code" -le 3 || { echo "audit failed to run, exit $code"; exit 1; }
          python3 -c "
          data = open('out.txt', 'rb').read()
          for bad in (b'\x1b', b'\x00', b'\x07'):
              assert bad not in data, 'escape sequence leaked into output: %r' % bad
          print('output is clean')
          "

      # mcp-vet audits itself, and is EXPECTED to flag itself CRITICAL. Its
      # rule catalogue contains the very patterns it searches for, and its
      # fixtures are deliberately malicious. See "Worked example" in
      # SECURITY.md. What this step asserts is that the run completes and
      # produces a valid report - not a severity ceiling, which would only
      # tempt someone to tune the rules until the tool stopped seeing itself.
      - name: Self-audit completes and produces a valid report
        run: |
          set +e
          mcp-vet report --offline --path . --purpose "MCP server security auditor" > self.json
          code=$?
          set -e
          test "$code" -ne 4 || { echo "self-audit failed to run"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('self.json'))
          assert d['schema_version'], 'no schema version'
          assert d['findings'], 'self-audit found nothing, which would mean the rules stopped firing'
          print('self-audit produced', len(d['findings']), 'findings as expected')
          "

  # 244 test yesilken paket derlenmiyordu.
  #
  # pyproject.toml'un 8. satiri `\r\r\n` ile bitiyordu - tek fazla bir satir
  # basi karakteri. Python'un tomllib'i bunu yutuyor, uv'nin siki ayristiricisi
  # yutmuyor: "carriage return must be followed by newline". Yani `pip install`
  # calisiyordu, `uv build` calismiyordu, ve hicbir test paketlemeye
  # dokunmadigi icin CI bunu hic gormedi.
  #
  # Bir araci kimse kuramiyorsa kac testi gectigi onemli degil. Bu is,
  # yayinlanabilirligi testlerle ayni seviyeye cikariyor.
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 14 sn
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Paket derleniyor mu
        run: uv build

      - name: Uretilen paket gecerli mi
        run: |
          set -e
          uvx twine check dist/*
          echo "--- uretilenler:"
          ls -la dist/

      # Derlenmis tekerlekten kurulup gercekten calismali. `uv build`in
      # basarili olmasi, paketin icinde dogru dosyalarin oldugunu kanitlamaz:
      # eksik bir paket verisi ya da yanlis bir giris noktasi ancak kurulunca
      # ortaya cikar.
      - name: Tekerlekten kurulunca komut calisiyor
        run: |
          set -e
          uv venv /tmp/deneme
          VIRTUAL_ENV=/tmp/deneme uv pip install dist/*.whl
          /tmp/deneme/bin/mcp-vet --help > /dev/null
          /tmp/deneme/bin/mcp-vet audit --offline --path tests/fixtures/clean_server > /dev/null
          echo "kurulan paket calisiyor"
